project:
  name: sequential_instruction_tuning_assignment3
  seed: 42

models:
  student_model: microsoft/Phi-3.5-mini-instruct
  teacher_model: meta-llama/Llama-3.1-70B-Instruct
  judge_model: meta-llama/Llama-3.1-70B-Instruct

data:
  alpaca_train_path: data/processed/alpaca_train.jsonl
  alpaca_eval_path: data/processed/alpaca_eval.jsonl
  json_train_path: data/processed/json_teacher_train.jsonl
  json_eval_path: data/processed/json_eval.jsonl

training:
  max_seq_length: 1024
  load_in_4bit: true
  bf16: true
  gradient_checkpointing: true

stage1:
  epochs: 2
  learning_rate: 2e-5
  batch_size: 4
  grad_accum: 4
  output_dir: outputs/checkpoint1

stage2:
  epochs: 2
  learning_rate: 2e-5
  batch_size: 4
  grad_accum: 4
  output_dir: outputs/checkpoint2

lora:
  r: 16
  alpha: 32
  dropout: 0.05

evaluation:
  alpaca_eval_size: 100
  json_eval_size: 100
  max_new_tokens: 256
  temperature: 0.2